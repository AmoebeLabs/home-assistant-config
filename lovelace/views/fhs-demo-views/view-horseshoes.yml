# This is the horseshoes view
#
title: FHS-horseshoes
path: FHS-horseshoes
panel: false
type: sections
max_columns: 2
layout: responsive

sections:
- type: grid
  # title: My Horseshoes...
  cards:
    # --------------------------------------------------------------------------------
    # - type: markdown
    #   content: |
    #     ## Note
    #     From a very basic Horseshoe to more advanced cards with horseshoes and sparklines
    # --------------------------------------------------------------------------------

    - type: custom:flex-horseshoe-card

      entities:
        - entity: sensor.awair_element_study_temperature
          name: Temperature
      grid_options:
        columns: 6
      layout:
        aspectratio: 1/1

        horseshoes:
          - entity_index: 0
            xpos: 50
            ypos: 50
            radius: 45
            horseshoe_scale:
              min: 0
              max: 40
            show:
              horseshoe_style: colorstop
            color_stops:
              colors:
                0: "#42a5f5"
                20: "#66bb6a"
                30: "#f9a825"
                40: "#d32f2f"

        icons:
          - entity_index: 0
            xpos: 50
            ypos: 30
            icon_size: 3

        states:
          - entity_index: 0
            xpos: 50
            ypos: 57
            styles:
              font-size: 2.5em
              font-weight: bold

        names:
          - entity_index: 0
            xpos: 50
            ypos: 95
            styles:
              text-transform: none


    # Example 36::
    #
    #######################################################################

    - type: custom:flex-horseshoe-card
      grid_options:
        columns: 6
      entities:
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          decimals: 2
          name: 'Total'
          area: ':36:'
      template:
        name: fhs_card_036_horseshoe_power

    # --------------------------------------------------------------------------------
    # - type: markdown
    #   content: |
    #     ## Note
    #     Horseshoes based on power entities...
    # --------------------------------------------------------------------------------
- type: grid
