        - entity: sensor.dsmr_reading_electricity_currently_delivered
          decimals: 0
          unit: W
          name: PV1
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          decimals: 0
          unit: W
          name: PV2
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: V
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: V
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: A
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: A
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: kWh
          name: Production
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          decimals: 1
          unit: kWh
          name: Remaining
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: kWh
          name: Total production
        - entity: sensor.dsmr_reading_electricity_currently_delivered
          unit: kWh
          name: Tomorrow
      template:
        name: fhs_card_021_horseshoe_solar

