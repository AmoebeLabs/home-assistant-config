# This is the sparklines view
#
title: FHS-sparklines
path: FHS-sparklines
panel: false
type: sections
max_columns: 2

sections:
- type: grid
  title: Multi-series test
  cards:
    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_livingroom_temperature
        - entity: sensor.awair_element_bedroom_temperature
        - entity: sensor.awair_element_study_temperature
      template:
        name: fhs_card_multi_series_test

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_livingroom_temperature
        - entity: sensor.awair_element_bedroom_temperature
        - entity: sensor.awair_element_study_temperature
      template:
        name: fhs_card_multi_series_test_bars

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_temperature
          name: Study temperature
          unit: C
      template:
        name: fhs_card_multi_series_test_offset

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_livingroom_temperature
          name: Livingroom temperature
          unit: C
        - entity: sensor.awair_element_bedroom_temperature
          name: Bedroom temperature
          unit: C
        - entity: sensor.awair_element_study_humidity
          name: Study humidity
          unit: '%'
      template:
        name: fhs_card_multi_series_dual_axis_fixed

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_livingroom_temperature
          name: Livingroom temperature
          unit: C
        - entity: sensor.awair_element_bedroom_temperature
          name: Bedroom temperature
          unit: C
        - entity: sensor.awair_element_study_humidity
          name: Study humidity
          unit: '%'
      template:
        name: fhs_card_multi_series_dual_axis_auto


- type: grid
  title: Sparkline Pollen Graded
  cards:
    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.kleenex_pollen_radar_zoefdehaas_bomen_niveau
          area: ':53v2:'
          name: 'Trees'
        - entity: sensor.kleenex_pollen_radar_zoefdehaas_gras_niveau
          name: 'Grass'
          area: 'Kleenex Pollen'
        - entity: sensor.kleenex_pollen_radar_zoefdehaas_kruiden_niveau
          name: 'Weed'

      layout:
        sparklines:
          - id: pollen-levels
            entity_index: 0
            xpos: 50
            ypos: 50
            width: 80
            height: 35

            period:
              type: rolling_window
              rolling_window:
                duration:
                  hour: 24
                bins:
                  per_hour: auto
                  density: medium

            sparkline:
              show:
                chart_type: graded
              state_values:
                aggregate_func: last
              graded:
                square: false
              color_stops:
                colors:
                  - state: low
                    color: "#66bb6a"
                    rank: 0
                  - state: moderate
                    color: "#f9a825"
                    rank: 1
                  - state: high
                    color: "#ed8003"
                    rank: 2
                  - state: very_high
                    color: "#d32f2f"
                    rank: 3

- type: grid
  title: Sparkline Min/Avg/Max Awair
  cards:
    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_score
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_score

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_temperature
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_temperature
          - var_show_chart_type: equalizer

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_humidity
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_humidity
          - var_show_chart_type: dots

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_carbon_dioxide
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_co2
          - var_show_chart_type: bar

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_volatile_organic_compounds
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_voc
          - var_show_chart_type: barcode
          - var_show_chart_variant: audio

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.awair_element_study_pm2_5
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_awair_pm25


- type: grid
  title: Sparkline Min/Avg/Max Power
  cards:
    - type: custom:flex-horseshoe-card
      entities:
