    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.dsmr_reading_phase_currently_delivered_l1
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_energy_deliverd_4kw

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.dsmr_reading_phase_currently_delivered_l2
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_energy_deliverd_4kw

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.dsmr_reading_phase_currently_delivered_l3
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_energy_deliverd_4kw    

- type: grid
  title: Sparkline Min/Avg/Max Illuminance
  cards:

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.livingroom_illuminance_front_illuminance
          name: "Illuminance Front"
      template:
        name: fhs_card_060_sensor_history_min_avg_max
        variables:
          - var_colorstop: fhs_colorstops_illuminance    

    - type: custom:flex-horseshoe-card
      entities:
        - entity: sensor.livingroom_illuminance_tv_illuminance
          name: "Illuminance Center"
      template:
