title: FHS-server-panel
path: FHS-server-panel
type: custom:grid-layout

layout:
  grid-template-columns: repeat(8, minmax(0, 1fr))
  gap: 12px

  mediaquery:
    "(max-width: 700px)":
      grid-template-columns: repeat(2, minmax(0, 1fr))

    "(max-width: 1200px)":
      grid-template-columns: repeat(4, minmax(0, 1fr))

    "(max-width: 1600px)":
      grid-template-columns: repeat(6, minmax(0, 1fr))


cards:
  - type: custom:mod-card
    view_layout:
      grid-column: 1 / -1
    card_mod:
      style: |
        ha-card {
          background: var(--card-background-color, rgba(255, 255, 255, 0.05));
          border: 1px solid var(--divider-color, rgba(255, 255, 255, 0.15));
          border-radius: 16px;
          padding: 6px;
        }
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout

      layout:
        grid-template-columns: repeat(8, minmax(0, 1fr))
        gap: 12px
        mediaquery:
          "(max-width: 700px)":
            grid-template-columns: repeat(2, minmax(0, 1fr))

          "(max-width: 1200px)":
            grid-template-columns: repeat(4, minmax(0, 1fr))

          "(max-width: 1600px)":
            grid-template-columns: repeat(6, minmax(0, 1fr))

      cards:
        - type: heading
          heading: CPU and Load
          view_layout:
            grid-column: 1 / -1
        - type: custom:flex-horseshoe-card
          view_layout:
            grid-column: span 1
          entities:
            - entity: sensor.domiducus_agent_cpu
              # name:
              #   - type: device
              #   - type: text
              #     text: "-"
              #   - type: entity
          template:
            name: fhs_card_036b_horseshoe_any
            variables:
              - var_colorstop_template: fhs_colorstops_cpu_load

      # LOAD 3x
        - type: custom:flex-horseshoe-card
          view_layout:
            grid-column: span 1
          entities:
            - entity: sensor.domiducus_agent_load_average_1m
          template:
            name: fhs_card_036b_horseshoe_any
            variables:
              - var_colorstop_template: fhs_colorstops_load_average

        - type: custom:flex-horseshoe-card
          view_layout:
            grid-column: span 1
          entities:
            - entity: sensor.domiducus_agent_load_average_5m
          template:
            name: fhs_card_036b_horseshoe_any
            variables:
              - var_colorstop_template: fhs_colorstops_load_average

        - type: custom:flex-horseshoe-card
          view_layout:
            grid-column: span 1
          entities:
            - entity: sensor.domiducus_agent_load_average_15m
          template:
            name: fhs_card_036b_horseshoe_any
            variables:
              - var_colorstop_template: fhs_colorstops_load_average

  # =================================================================

  - type: custom:mod-card
    view_layout:
      # grid-column: span 14
      grid-column: 1 / -1
    card_mod:
      style: |
        ha-card {
          background: var(--card-background-color, rgba(255, 255, 255, 0.05));
          border: 1px solid var(--divider-color, rgba(255, 255, 255, 0.15));
