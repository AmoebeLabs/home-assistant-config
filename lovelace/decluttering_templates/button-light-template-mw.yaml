#
# Template  : button-light-template-mw
# Card:     : custom:button-card
# Project   : Home Assistant
# Repository: https://github.com/AmoebeLabs/Home-Assistant-Config
#
# Author    : Mars @ AmoebeLabs.com
# 
# License   : CC BY-SA, https://creativecommons.org/licenses/by/4.0/
#
# -----
# Description:
#   Decluttering template for the button card for light entities
#   The light template shows:
#   - the icon which changes color depending on the color of the light
#   - the name of the entity 
#   - the area (manually entered from the view/card)
#   - the state of the light: On or Off in the lower left side
#   - the percentage of the brightness in the lower right side.
#     Nothing is displayed if the light doesn't have a brightness value.
#
#   Note:
#   This template uses the Nyx and Hemera themes for settings!!
#   You can find them in my repository ;-)
#   
#   References:
#
###############################################################################

default:
  - area: ""
  - aspect_ratio: 1/1
  - color: auto
  - lock: false
  - size: 40%
  - spin: false
  - show_state: true
  - show_label: true
  - tap_action: toggle
  - hold_action: more-info


card:
  type: custom:button-card
  name: '[[name]]'
  deep_press: false
  icon: 'mdi:[[icon]]'
  size: '[[size]]'
  color: '[[color]]'
  lock: '[[lock]]'
  aspect_ratio: '[[aspect_ratio]]'
  entity: '[[entity]]'
  show_state: '[[show_state]]'
  show_label: '[[show_label]]'
  show_last_changed: false
  tap_action:
    action: '[[tap_action]]'
    haptic: light
  hold_action:
    action: '[[hold_action]]'
    haptic: heavy
  styles:
    card:
      - --ha-card-background: var(--theme-button-card-color-state-off)
    grid:
      # Define the grid with the icon, name, area, status and brightness (label)
      - grid-template-areas: '"i i" "n n" "area area" "s l"'
      - grid-template-columns: 1fr lfr
      - grid-template-rows: 1fr min-content min-content min-content
      - position: relative  # NEW NEW
    img_cell:
      - align-self: start
      - text-align: start
      - margin-right: 0px
    name:
      - font-family: Helvetica 
      - font-size: 15px
      - font-weight: bold
      - text-transform: capitalize
      - justify-self: start
      - padding-left: 10px
    custom_fields:
      area:
        - font-family: Helvetica 
        - font-size: 13px
        - text-transform: capitalize
        - justify-self: start
        - padding-left: 10px
      notification:
        - background-color: >
            [[[
              if (entity.state === 'off')
                return "var(--primary-background-color)";
              return "var(--theme-gradient-color-06)";
            ]]]
        - border-radius: 50%
        - position: absolute
        - left: 9%
        - top: 5%
        - height: 12px
        - width: 12px
        - font-size: 8px
        - line-height: 16px
        - box-shadow: >
            [[[
              if (entity.state === 'off')
                return "none";
              return "0px 0px 1px 3px var(--theme-gradient-color-02-5pct), 0px 0px 7px 7px var(--theme-gradient-color-02-10pct";
            ]]]
    state:
      - font-family: Helvetica
      - font-size: 12px
      - font-weight: bold
      - text-transform: capitalize
      - padding: 0px 10px
      - justify-self: start
      - padding-left: 10px
    label:
      - font-family: Helvetica
      - font-size: 12px
      - font-weight: bold
      - padding: 0px 10px
      - justify-self: start

  custom_fields:
    area: '[[area]]'
    notification: '' 

  label: >
    [[[
      if (typeof(entity) === 'undefined') return;
      
      if ('brightness' in entity.attributes)
      {
        if (entity.attributes
        && (entity.attributes.brightness <= 255)) {
          var bri = Math.round(entity.attributes.brightness / 2.55);
          return (bri ? bri : '0') + '%';
        }
      }
    ]]]

  # As every state is defined in the theme, and we have no other settings than color per state,
  # a template can be used to set the color and background of the card.
  # This saves having to write code for all the different states!
  #
  # Even a decluttering template can be decluttered ;-)
  #
  # Note: even while the theme contains the --button-card-light-color, it doesn't work always, so the template is back in.
  state:
    - value: "[[[ return '' + entity.state + ''; ]]]"
      styles:
        card:
          - --ha-card-background: "[[[ return 'var(--theme-button-card-color-state-' + entity.state + ')'; ]]]"
        icon:
          - color: "[[[ return 'var(--theme-button-icon-color-state-' + entity.state + ', --button-card-light-color)'; ]]]"
#          - color: "[[[ if (entity.state == 'on') return 'var(--button-card-light-color, blue)'; else return  #'var(--theme-button-icon-color-state-' + entity.state + ')'; ]]]"
#          - color: "[[[ return 'var(--theme-button-icon-color-state-' + entity.state + ', --button-card-light-color)'; ]]]"
#          - color: var(--theme-button-icon-color-state-on, --button-card-light-color);
        lock:
          - color: "[[[ return 'var(--theme-button-lock-color-state-' + entity.state + ')'; ]]]"
        label:
          - color: "[[[ return 'var(--theme-button-label-color-state-' + entity.state + ')'; ]]]"
        name:
          - color: "[[[ return 'var(--theme-button-name-color-state-' + entity.state + ')'; ]]]"
        state:
          - color: "[[[ return 'var(--theme-button-state-color-state-' + entity.state + ')'; ]]]"
        custom_fields:
          area:
            - color: "[[[ return 'var(--theme-button-area-color-state-' + entity.state + ')'; ]]]"
