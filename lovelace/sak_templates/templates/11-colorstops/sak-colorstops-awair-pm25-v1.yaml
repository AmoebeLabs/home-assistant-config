sak_colorstops_awair_pm25_v1:
  template:
    type: colorstops
    defaults:
      - thegap: 0
      - theFill: true
      - theStroke: false
  colorstops:
    gap: '[[thegap]]'
    fill: '[[theFill]]'
    stroke: '[[theStroke]]'
    colors:
      0: '#49ce4b'
      12: '#fed125'
      35: '#f98602'
      55: '#e9343d'
      150: '#7e39d6'
