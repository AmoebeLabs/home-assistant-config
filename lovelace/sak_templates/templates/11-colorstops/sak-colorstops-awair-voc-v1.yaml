sak_colorstops_awair_voc_v1:
  template:
    type: colorstops
    defaults:
      - thegap: 0
      - theFill: true
      - theStroke: false
  colorstops:
    gap: '[[thegap]]'
    fill: '[[theFill]]'
    stroke: '[[theStroke]]'
    colors:
      0: '#49ce4b'
      300: '#fed125'
      500: '#f98602'
      3000: '#e9343d'
      25000: '#7e39d6'
