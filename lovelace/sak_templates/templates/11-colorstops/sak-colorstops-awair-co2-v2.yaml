sak_colorstops_awair_co2_v2:
  template:
    type: colorstops
    defaults:
      - sak_colorstop_scale: default
      - sak_colorstop_scale_min: 0
      - sak_colorstop_scale_max: 5000
  colorstops:
    scales:
      default:
        min: 0
        max: 5000
    colors:
      - value: 0
        color: '#49ce4b'
        rank: 0
      - value: 600
        color: '#fed125'
        rank: 1
      - value: 1000
        color: '#f98602'
        rank: 2
      - value: 2000
        color: '#e9343d'
        rank: 3
      - value: 4500
        color: '#7e39d6'
        rank: 4
  