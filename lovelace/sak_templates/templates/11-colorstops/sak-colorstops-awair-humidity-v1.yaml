sak_colorstops_awair_humidity_v1:
  template:
    type: colorstops
    defaults:
      - thegap: 0
      - theFill: true
      - theStroke: false
  colorstops:
    gap: '[[thegap]]'
    fill: '[[theFill]]'
    stroke: '[[theStroke]]'
    colors:
      0: '#73e39d6'
      14.50: '#7e39d6'
      22.50: '#f98602'
      29.50: '#fed125'
      39.50: '#fed125'
      49.50: '#fed125'
      59.50: '#f98602'
      64.50: '#7e39d6'
      79.50: '#7e39d6'
 