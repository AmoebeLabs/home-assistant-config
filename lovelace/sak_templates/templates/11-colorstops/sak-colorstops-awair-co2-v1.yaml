
sak_colorstops_awair_co2_v1:
  template:
    type: colorstops
    defaults:
      - thegap: 0
      - theFill: true
      - theStroke: false
  colorstops:
    gap: '[[thegap]]'
    fill: '[[theFill]]'
    stroke: '[[theStroke]]'
    colors:
      0: '#49ce4b'
      600: '#fed125'
      1000: '#f98602'
      2000: '#e9343d'
      4500: '#7e39d6'
  