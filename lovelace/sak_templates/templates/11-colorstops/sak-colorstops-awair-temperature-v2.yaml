sak_colorstops_awair_temperature_v2:
  template:
    type: colorstops
    defaults:
      - dummy: 0
  colorstops:
    scales:
      default:
        min: 0
        max: 35
    colors:
      - value: -1000
        color: '#7e39d6'    # Purple
        rank: 4
      - value:  8
        color: '#e9343d'    # Red
        rank: 3
      - value: 16
        color: '#f98602'    # Orange
        rank: 2
      - value: 18
        color: '#fed125'    # Yellow
        rank: 1
      - value: 20
        color: '#49ce4b'    # Green
        rank: 0
      - value: 25.001
        color: '#fed125'    # Yellow
        rank: 1
      - value: 27.001
        color: '#f98602'    # Orange
        rank: 2
      - value: 29.001
        color: '#e9343d'    # Red
        rank: 3
      - value: 34.001
        color: '#7e39d6'    # Purple
        rank: 4
  