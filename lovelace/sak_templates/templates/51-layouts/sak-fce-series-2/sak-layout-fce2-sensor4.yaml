sak_layout_fce2_sensor4:
  template:
    type: layout
    defaults: 
        # Chart types barcode, dots, line, area, bar or graded work nicely
        # The equalizer not!
      - sak_layout_sparkline_type: graded
        # Check documentation for chart variant per chart type
      - sak_layout_sparkline_variant: rank_order
      - sak_layout_background_icon_disabled: false
      - sak_layout_colorstop_v1: sak_colorstops_awair_temperature_v1
      - sak_layout_colorstop_v2: sak_colorstops_awair_temperature_v2
      - sak_layout_scale_max: 100
      - sak_layout_sparkline_show_dots: false
      - sak_layout_sparkline_show_minmax: false

  layout:
    aspectratio: 1/1
    toolsets:
      # ==============================================================================
      - toolset: background-icon
        position:
          cx: 100
          cy: 37.5
        tools:
          # - dref: 8 -----------------------------------------------------------
          - type: icon
            # When disabled, SAK will not use this tool
            disabled: '[[sak_layout_background_icon_disabled]]'
            position:
              cx: 50
              cy: 50
              align: center
              icon_size: 50
            entity_index: 0
            styles:
              icon:
                fill: var(--theme-sys-elevation-surface-neutral3)
      # ==============================================================================
      - toolset: circle-with-icon
        position:
          cx: 20
          cy: 20
        tools:
          # - dref: 3 -----------------------------------------------------------
          - type: 'segarc'
            entity_index: 0
            position:
              cx: 50
              cy: 50
              start_angle: 0
              end_angle: 360
              width: 2
              radius: 12.5
            scale:
              min: 0
              max: '[[sak_layout_scale_max]]'
            show:
              scale: false
              style: 'colorstops'
              lastcolor: true
            segments:
              colorstops:
                template: 
                  name: '[[sak_layout_colorstop_v1]]'
            styles:
              foreground:
                fill: var(--theme-gradient-color-02)
              background:
                fill: var(--primary-background-color)
          # - dref: 1 -----------------------------------------------------------
          - type: circle
            position:
              cx: 50
              cy: 50
              radius: 9
            entity_index: 0
            colorstops:
              template: 
                name: '[[sak_layout_colorstop_v1]]'
            show:
              style: colorstops
            styles:
              circle:
                transition: fill 2s ease
                stroke-width: 2em
          # - dref: 2 -----------------------------------------------------------
          - type: icon
            position:
              cx: 50
              cy: 50
              align: center
              icon_size: 15
            entity_index: 0
            styles:
              icon:
                fill: var(--primary-background-color)
      # ==============================================================================
      - toolset: area-name
        position:
          cx: 7.5
          cy: 45
        tools:
          # - dref: 5 -----------------------------------------------------------
          - type: area
            position:
              cx: 50
              cy: 50
            entity_index: 0
            show:
              ellipsis: 12
            styles: 
              area: 
                text-anchor: start
                font-size: 12em
                font-weight: 700
                opacity: 1
          # - dref: 6 -----------------------------------------------------------
          - type: name
            position:
              cx: 50
              cy: 62.5
            entity_index: 0
            show:
              ellipsis: 16
            styles: 
              name: 
                text-anchor: start
                font-size: 10em
                font-weight: 400
                opacity: 0.6

      # ==============================================================================
      - toolset: score-state
        position:
          cx: 92.8
          cy: 15
        tools:
          # - dref: 4 -----------------------------------------------------------
          - type: state
            position:
              cx: 50
              cy: 50
            entity_index: 0
            show: 
              uom: end
            styles:
              state:
                font-size: 15em
                text-anchor: end
                font-weight: 700
              uom:
                font-weight: 600

      # ==============================================================================
      - toolset: graph-sensor
        position:
          cx: 50
          cy: &sensor_cy 78
        tools:
          # - dref: 7 -----------------------------------------------------------
          - type: sparkline
            position: &graph_pos
              cx: 50
              cy: 50
              width: 85
              height: 25
            entity_index: 0
            entity_indexes:
              - entity_index: 0
            period:
              calendar:
                period: day
                offset: 0
                duration:
                  hour: 24
                bins:
                  per_hour: 1
            sparkline:
              animate: true
              show:
                chart_type: '[[sak_layout_sparkline_type]]'
                chart_variant: '[[sak_layout_sparkline_variant]]'
                fill: false
              state_values:
                aggregate_func: avg
              area:
                line_width : 1.5
                show_dots: '[[sak_layout_sparkline_show_dots]]'
                show_minmax: '[[sak_layout_sparkline_show_minmax]]'
              bar:
                line_width : 0.1
                colum_spacing: 1
              dots:
                line_width: 2
              equalizer:
                value_buckets: 5
              graded:
                square: true
                line_width : 1.5
              line:
                line_width : 1.5
                show_dots: '[[sak_layout_sparkline_show_dots]]'
                show_minmax: '[[sak_layout_sparkline_show_minmax]]'
              x_lines:
                lines:
                  - name: x_axis
                    zpos: below 
                    yshift: 15
                  - name: ticks
                    zpos: below 
                    yshift: 16
              colorstops_transition: hard
              colorstops:
                template:
                  name: '[[sak_layout_colorstop_v2]]'
              styles: &graded_rank_order_styles
                barcode_graph:
                  rx: 50%
                  ry: 5%
                graded_background:
                  transition: fill 2s ease
                  rx: 50%
                  ry: 50%
                graded_foreground:
                  transition: fill 2s ease
                  rx: 50%
                  ry: 50%
                x_axis:
                  stroke: var(--theme-sys-elevation-surface-neutral6)
                  stroke-width: 0.2rem
                ticks:
                  stroke: var(--theme-sys-elevation-surface-neutral6)
                  stroke-dasharray: 2, 117.5
                  stroke-dashoffset: 0
                  stroke-width: 0.75rem
