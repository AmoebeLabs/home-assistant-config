fhs_colorstops_cpu_load_v1:
  template:
    type: colorstops
  colorstops:
    scales:
      default:
        min: 0
        max: 100
    modes:
      dark:
        - value: 0
          color: '#343A40'
        - value: 1
          color: '#3B82B6'
        - value: 2
          color: '#2F9CC0'
        - value: 5
          color: '#28B6B0'
        - value: 10
          color: '#36BE88'
        - value: 25
          color: '#72C45A'
        - value: 50
          color: '#B9C84A'
        - value: 75
          color: '#F0A13A'
        - value: 100
          color: '#E0524D'
      light:
        - value: 0
          color: '#E5E7EB'
        - value: 1
          color: '#B8D7EE'
        - value: 2
          color: '#8CC7E3'
        - value: 5
          color: '#69C9C7'
        - value: 10
          color: '#7BCFA8'
        - value: 25
          color: '#A6D47B'
        - value: 50
          color: '#D3D86A'
        - value: 75
          color: '#F2BB67'
        - value: 100
          color: '#E97870'
