fhs_colorstops_disk_usage:
  template:
    type: colorstops

  colorstops:
    scales:
      default:
        min: 0
        max: 100

    modes:
      dark:
        - value: 0
          color: '#3B82B6'
        - value: 50
          color: '#2F9CC0'
        - value: 70
          color: '#28B6B0'
        - value: 80
          color: '#36BE88'
        - value: 85
          color: '#72C45A'
        - value: 90
          color: '#B9C84A'
        - value: 95
          color: '#F0A13A'
        - value: 100
          color: '#E0524D'

      light:
        - value: 0
          color: '#B8D7EE'
        - value: 50
          color: '#8CC7E3'
        - value: 70
          color: '#69C9C7'
        - value: 80
          color: '#7BCFA8'
        - value: 85
          color: '#A6D47B'
        - value: 90
          color: '#D3D86A'
        - value: 95
          color: '#F2BB67'
        - value: 100
          color: '#E97870'