fhs_card_035_horseshoe_power:
  template:
    type: card
  card:
    layout:
      groups:
        - id: L1
          xpos: 65
          ypos: 45
        - id: L2
          same_as: L1
          same_as_dypos: 11
          # xpos: 65
          # ypos: 56
        - id: L3
          same_as: L2
          same_as_dypos: 11
          # xpos: 65
          # ypos: 67

      areas:
        - id: 0
          entity_index: 0
          xpos: 0
          ypos: 100
          styles:
            - font-size: 0.75em
            - text-transform: none     
            - text-anchor: start                       
      icons:
        - id: 0
          entity_index: 0
          yposc: 50
          xpos: 8
          icon_size: 3 #1.5
          icon: url(/local/icons/icon-test.svg)
          color_stops:
            gap: 3
            type: gradient # colorstopgradient
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'

      hlines:
        - xpos: 70
          ypos: 30
          length: 40
          styles:
            - stroke: var(--disabled-text-color);

      circles:
        - xpos: 50
          ypos: 47
          group: L1
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - same_as: 0
          group: L2
        - same_as: 0
          group: L3

        - ypos: 50
          xpos: -50 #-41 #-36
          radius: 175
          styles:
            - fill: var(--primary-background-color);
            - opacity: 0.7;
            - stroke: var(--disabled-text-color);
            - stroke-width: 2
            - filter: drop-shadow(0 0.05em 0 rgba(255, 255, 255, 0.25)) drop-shadow(0.08em 0.75em 0.16em rgba(0, 0, 0, 0.35))
      states:
        - entity_index: 0
          xpos: 70
          ypos: 20
          styles:
            - font-size: 2.5em
            - font-weight: bold
        - entity_index: 1
          group: L1
          xpos: 53
          ypos: 50
          styles:
            - text-anchor: start;
            - font-size: 1.2em;                  
        - entity_index: 2
          same_as: 1
          group: L2
        - entity_index: 3
          same_as: 1
          group: L3
      names:
        - id: 0
          entity_index: 0
          xpos: 70
          ypos: 98
          ellipsis: 20
          styles:
            - font-size: 1.4em
            - text-transform: none
        - entity_index: 1
          xpos: 47 # 42
          ypos: 50
          group: L1
          styles:
            - text-anchor: end;
            - font-size: 1.2em;                  
        - entity_index: 2
          same_as: 1
          group: L2
        - entity_index: 3
          same_as: 1
          group: L3

      horseshoes_v2:
        - entity_index: 0
          ypos: 50
          xpos: -45
          radius: 70 #70 #45
          tickmarks_radius: 43
          arc_degrees: 70
          flip: y
          rotate: -90
          
          show:
            horseshoe: true
            scale_tickmarks: false
            horseshoe_style: colorstopgradient
            scale_style: fixed #colorstop #fixed
            labels_at: ticks_major # colorstop, none, ticks_major, both, minmax
            ticks: true
            label_badges: true                  
            label_background: none # none, fixed, colorstop
          # 
          horseshoe_scale:
            min: 0
            max: 5
            width: 6
            color: var(--disabled-text-color) #var(--primary-background-color)
            ticksize: 0.1 # 5-0 = 5 with 0.1 per tick = 50 ticks.
            gap: 3
            styles:
              - opacity: 0.7;
          #
          horseshoe_tickmarks:
            ticks_major:
              ticksize: 1
              color_mode: colorstopinterpolated
              width: 12
              offset: -9
              thickness: 1
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.7;
            ticks_minor:
              ticksize: 0.1
              color_mode: colorstopinterpolated
              thickness: 1
              width: 6
              offset: -12
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.5;
          #
          horseshoe_labels:
            distance_min: 0.3
            ticksize_min: 0.3
            orientation: horizontal #horizontal #arc
            background:
              width: 10
              gap: 3  
              styles:
                - opacity: 0.05;
                - stroke: var(--primary-text-color);
            badges:
              radius: 6
              color: var(--card-background-color)
              border_color: var(--divider-color)
              padding: 0
              height: 10    # 12 is same as font-size of 1em    
            styles:
              - font-size: 0.7em
          #
          horseshoe_state:
            width: 12
            # styles:
            #   - filter: drop-shadow(0.1em 0.5em 0.2em rgba(0, 0, 0, 0.5))
          #
          color_stops:
            gap: 3
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'
