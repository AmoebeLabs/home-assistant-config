fhs_card_030_horseshoe_power:
  template:
    type: card
  card:
    dev:
      debug_colors: false

    palettes:
      rainbow: /local/palettes/rainbow-palette-new.json  

    constants:
      centerX: 50
      centerY: 50
      lineStep: 11
      lineLength: calc(4 * 20 + 5)       
      disabledLineStyle:
        stroke: var(--disabled-text-color)
        stroke-width: 2         
      defaultColorStops:
        mode: gradient
        gap: 3
        colors:
          - value: 0
            color: var(--fhs-sys-rainbow-blue)
          - value: 1
            color: var(--fhs-sys-rainbow-green)
          - value: 2
            color: var(--fhs-sys-rainbow-yellow)
          - value: 3
            color: var(--fhs-sys-rainbow-orange)
          - value: 4
            color: var(--fhs-sys-rainbow-red)
          - value: 5
            color: var(--fhs-sys-rainbow-purple)
          # 0: var(--fhs-sys-rainbow-blue)
          # 1: var(--fhs-sys-rainbow-green)
          # 2: var(--fhs-sys-rainbow-yellow)
          # 3: var(--fhs-sys-rainbow-orange)
          # 4: var(--fhs-sys-rainbow-red)
          # 5: var(--fhs-sys-rainbow-purple)

    layout:
      groups:
        - id: L1
          xpos: 23
          ypos: 72
        - id: L2
          xpos: 73
          ypos: 72
        - id: L3
          xpos: 48
          ypos: 83

      areas:
        - id: all
          entity_index: 0
          xpos: 0
          ypos: 100
          styles:
            - font-size: 0.75em
            - text-transform: none     
            - text-anchor: start                       
      icons:
        - id: first
          entity_index: 0
          xpos: 50
          ypos: 10
          size: 1.5
          color_stops: ref(defaultColorStops)
      hlines:
        - id: first
          xpos: calc(centerX)
          ypos: 64
          length: calc(4 * 20 + 5)
          styles:
            - ref(disabledLineStyle)
            - opacity: 0.8
        - id: second
          same_as: first
          same_as_dypos: calc(1 * lineStep)
        - id: third
          same_as: first
          same_as_dypos: calc(2 * lineStep)
      vlines:
        - id: first
          xpos: 50
          ypos: 69.5
          length: 11
          styles:
            - stroke: var(--disabled-text-color);

      circles:
        - id: first
          group: L1 
          xpos: 47 
          ypos: 47
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - id: second
          group: L2
          same_as: first
        - id: third
          group: L3
          same_as: first

        - id: bigone
          xpos: calc(centerX) #50
          ypos: calc(-centerY) #-50
          radius: 175
          styles:
            - fill: var(--primary-background-color);
            - opacity: 0.7;
            - stroke: var(--disabled-text-color);
            - stroke-width: 2
      states:
        - id: all
          entity_index: 0
          xpos: 50
          ypos: 56
          styles:
            - font-size: 2.5em
            - font-weight: bold
        - id: first
          group: L1
          entity_index: 1
          xpos: 50
          ypos: 50
          styles:
            - text-anchor: start;
            - font-size: 1.2em;                  
        - id: second
          group: L2
          entity_index: 2
          same_as: first
        - id: third
          group: L3
          entity_index: 3
          same_as: first
      names:
        - id: all
          entity_index: 0
          xpos: 50
          ypos: 98
          ellipsis: 20
          styles:
            - font-size: 1.4em
            - text-transform: none
        - id: first
          entity_index: 1
          group: L1
          xpos: 44
          ypos: 50
          styles:
            - text-anchor: end;
            - font-size: 1.2em;                  
        - id: second
          entity_index: 2
          group: L2
          same_as: first
        - id: third
          entity_index: 3
          group: L3
          same_as: first
      horseshoes_v2:
        - id: first
          entity_index: 0
          xpos: 50
          ypos: -45
          radius: 70
          tickmarks_radius: 43
          arc_degrees: 70
          flip: both
          
          show:
            horseshoe: true
            scale_tickmarks: false
            horseshoe_style: colorstopgradient
            scale_style: fixed #colorstop #fixed
            labels_at: ticks_major # colorstop, none, ticks_major, both, minmax
            ticks: true
            label_badges: true                  
            label_background: none # none, fixed, colorstop
          # 
          horseshoe_scale:
            min: 0
            max: 5
            width: 6
            color: var(--primary-background-color)
            ticksize: 0.1 # 5-0 = 5 with 0.1 per tick = 50 ticks.
            gap: 3
            styles:
              - opacity: 0.7;
          #
          horseshoe_tickmarks:
            ticks_major:
              ticksize: 1
              color_mode: colorstopinterpolated
              width: 12
              offset: -9
              thickness: 3
              styles:
                - opacity: 0.9;
            ticks_minor:
              ticksize: 0.2
              color_mode: colorstopinterpolated
              thickness: 2
              width: 6
              offset: -12
              styles:
                - opacity: 0.7;
          #
          horseshoe_labels:
            distance_min: 0.3
            ticksize_min: 0.3
            orientation: horizontal #arc #horizontal #arc
            background:
              width: 10
              gap: 3  
              styles:
                - opacity: 0.05;
                - stroke: var(--primary-text-color);
            badges:
              radius: 6
              color: var(--card-background-color)
              border_color: var(--divider-color)
              padding: 0
              height: 10    # 12 is same as font-size of 1em    
            styles:
              - font-size: 0.7em
          #
          horseshoe_state:
            width: 12
          #
          # color_stops: |
          #   [[[ return constants['defaultColorStops']; ]]]
          # color_stops: ref(defaultColorStops)
          color_stops:
            gap: 3
            colors:
              0: var(--fhs-sys-rainbow-blue)
              1: var(--fhs-sys-rainbow-green)
              2: var(--fhs-sys-rainbow-yellow)
              3: var(--fhs-sys-rainbow-orange)
              4: var(--fhs-sys-rainbow-red)
              5: var(--fhs-sys-rainbow-purple)
