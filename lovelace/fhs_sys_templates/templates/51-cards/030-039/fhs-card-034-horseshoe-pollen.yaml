fhs_card_034_horseshoe_pollen:
  template:
    type: card
  card:
    constants:
      radius0: 5000
      xpos0: 15
      dxPos1: 35
      dxPos2: 35

    layout:
      areas:
        - entity_index: 0
          xpos: 0
          ypos: 100
          styles:
            - font-size: 0.75em
            - text-transform: none     
            - text-anchor: start                       
        - entity_index: 1
          xpos: 50
          ypos: 12
          styles:
            - font-size: 1.7em
            - text-transform: none     
      icons:
        - id: tree
          entity_index: 0
          xpos: calc(xpos0)
          ypos: 70
          size: 4.5
          state_map:
            map:
              - state: default
                icon: |
                  [[[
                    return `url(/local/images/kleenex/pollen_${item.id}_${state}.svg)`;
                  ]]]

        - id: grass
          entity_index: 1
          same_as: tree
          same_as_dxpos: calc(dxPos1)
        - id: weed
          entity_index: 2
          same_as: grass
          same_as_dxpos: calc(dxPos2)
      hlines:
        - xpos: 50
          ypos: 15
          length: 80
          styles:
            - stroke: var(--disabled-text-color);
        - same_as: 0
          same_as_dypos: 3
          same_as_dlength: 7.5
        - same_as: 1
          same_as_dypos: 3
          same_as_dlength: 7.5

      states:
        - entity_index: 0
          xpos: calc(xpos0)
          ypos: 90
          styles:
            - font-size: 1.0em
        - entity_index: 1
          same_as: 0
          same_as_dxpos: calc(dxPos1)
        - entity_index: 2
          same_as: 1
          same_as_dxpos: calc(dxPos2)

      names:
        - entity_index: 0
          xpos: calc(xpos0)
          ypos: 45
          styles:
            - font-size: 1.0em
            - text-transform: none     
        - entity_index: 1
          same_as: 0
          same_as_dxpos: calc(dxPos1)
        - entity_index: 2
          same_as: 1
          same_as_dxpos: calc(dxPos2)


      horseshoes:
        - entity_index: 0
          debug_state_map: false
          xpos: calc(xpos0)
          ypos: calc(-radius0 + xpos0 + 15) #-4975
          radius: calc(radius0)
          tickmarks_radius: calc(radius0)
          arc_degrees: .3
          flip: y #both
          
          show:
            horseshoe: true
            scale_tickmarks: false
            horseshoe_style: colorstop
            scale_style: colorstopsegments #fixed
            labels_at: segment #none #ticks_major # colorstop, none, ticks_major, both, minmax
            ticks: false #true
            label_badges: false #true
            label_background: none # none, fixed, colorstop
          # 
          horseshoe_scale:
            min: 0
            max: 4
            width: 6
            color: gray #var(--primary-background-color)
            gap: 0
            linecap: butt
            styles:
              - opacity: 0.4
          #
          horseshoe_tickmarks:
            ticks_major:
              ticksize: 1
              color_mode: colorstop
              width: 12
              offset: -9
              thickness: 3
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.7;
          #
          horseshoe_labels:
            distance_min: 0.3
            ticksize_min: 0.3
            ellipsis: 5
            orientation: arc #horizontal #arc #horizontal #arc
            offset: -10 #-34
            badges:
              radius: 6
              color: var(--card-background-color)
              border_color: var(--divider-color)
              padding: 0
              height: 10    # 12 is same as font-size of 1em    
            styles:
              - font-size: 0.3em
          #
          horseshoe_state:
            mode: stringstate_level
            debug_state_map: false
            width: 12
            linecap: butt
            state_map:
              map:
                - state: 'low'
                  value: 0.99
                - state: 'moderate'
                  value: 1.99
                - state: 'high'
                  value: 2.99
                - state: 'very_high'
                  value: 3.99
          #
          color_stops:
            gap: 0.01
            colors:
              0: '#838383'
              1: '#fcc449'
              2: '#ed8003'
              3: '#e73f10'

        - entity_index: 1
          same_as: 0
          same_as_dxpos: calc(dxPos1)
        - entity_index: 2
          same_as: 1
          same_as_dxpos: calc(dxPos2)
