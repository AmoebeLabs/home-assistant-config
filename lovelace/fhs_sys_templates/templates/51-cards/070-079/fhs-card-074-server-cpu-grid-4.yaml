      horseshoes:
        - id: grid-1
          group: grid-1
          xpos: 50
          ypos: 50

          entity_index: 0

          path:
            type: rectangle
            width: calc(grid_width)
            height: calc(grid_height)
            radius: 2
            start: 0
            direction: clockwise

          show:
            horseshoe: true
            horseshoe_style: colorstopinterpolated
            scale_style: none
            tickmarks: false
            labels_at: none

          horseshoe_scale:
            min: 0
            max: 100
            width: 0.5
            color: var(--divider-color)

          horseshoe_state:
            width: 3
            linecap: round
            color_filter: ref(theme_mode_filter)

            styles:
              opacity: 1

          color_stops:
            template:
              name: fhs_colorstops_cpu_load
        - id: grid-2
          group: grid-2
          same_as: grid-1
          same_as_dentity_index: 1
        - id: grid-3
          group: grid-3
          same_as: grid-2
          same_as_dentity_index: 1
        - id: grid-4
          group: grid-4
          same_as: grid-3
          same_as_dentity_index: 1