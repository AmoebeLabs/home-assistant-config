fhs_card_072_server_grid_4_history:
  template:
    type: card
    defaults:
      - var_colorstop_template: fhs_colorstops_cpu_load
      - var_title: 'CPU Load'
      - var_show_minmax: false
  card:
    aspectratio: 1/1.75

    constants:
      grid_height: 35
      grid_width: 42.5
      grid_spacing: 2.5
      grid_row_height: calc(grid_height + grid_spacing)
      column_1: calc(50 - (grid_spacing / 2) - (grid_width / 2))
      column_2: calc(100 - column_1)
      row_1: 40
      row_2: calc(row_1 + grid_row_height)

    layout:
      icons:
        - entity_index: 0
          xpos: 10
          yposc: 10
          size: 2.5
          icon: mdi:dots-grid
      texts:
        - id: title
          xpos: 20
          ypos: 10
          text: '[[var_title]]'
          styles:
            text-anchor: start
            font-size: 1.5em
            text-transform: none
            dominant-baseline: central
      groups:
        - id: grid-1
          xpos: calc(column_1)
          ypos: calc(row_1)
        - id: grid-2
          xpos: calc(column_2)
          ypos: calc(row_1)
        - id: grid-3
          xpos: calc(column_1)
          ypos: calc(row_2)
        - id: grid-4
          xpos: calc(column_2)
          ypos: calc(row_2)
        - id: chart
          xpos: 50
          ypos: 140

      rectangles:
        - id: grid-1
          group: grid-1
          xpos: 50
          ypos: 50
          width: calc(grid_width)
          height: calc(grid_height)
          radius: 2
          entity_index: 0
          show:
            item_style: colorstopinterpolated
          colorstopinterpolated:
            fill: true
            stroke: true
          color_stops:
            template:
              name: fhs_colorstops_cpu_load
          styles:
            stroke-width: 1
            stroke-opacity: 1
            fill-opacity: 0.7
            transition: fill 0.5s ease, stroke 0.5s ease              
        - id: grid-2
          group: grid-2
          same_as: grid-1
          same_as_dentity_index: 1
        - id: grid-3
          group: grid-3
          same_as: grid-2
          same_as_dentity_index: 1
        - id: grid-4
          group: grid-4
          same_as: grid-3
          same_as_dentity_index: 1

      names:
        - id: grid-1
          group: grid-1
          entity_index: 0
          xpos: 50
          ypos: 40
          ellipsis: 10
          styles:
            text-anchor: middle
            font-size: 1.15em # HA: 14px
            text-transform: none
            alignment-baseline: central
        - id: grid-2
          group: grid-2
          same_as: grid-1
          same_as_dentity_index: 1
        - id: grid-3
          group: grid-3
          same_as: grid-2
          same_as_dentity_index: 1
        - id: grid-4
          group: grid-4
          same_as: grid-3
          same_as_dentity_index: 1
      states:
        - id: grid-1
          group: grid-1
          entity_index: 0
          xpos: 50
          ypos: 54
          ellipsis: 5
          styles:
            text-anchor: middle
            font-size: 1.8em  # HA: 12px
            font-weight: bold
            alignment-baseline: central
        - id: grid-2
          group: grid-2
          same_as: grid-1
          same_as_dentity_index: 1
        - id: grid-3
          group: grid-3
          same_as: grid-2
          same_as_dentity_index: 1
        - id: grid-4
          group: grid-4
          same_as: grid-3
          same_as_dentity_index: 1

      sparklines:
        - id: grid-1
          group: grid-1
          entity_index: 0
          xpos: 50
          ypos: 65
          width: calc(grid_width - 5)
          height: 1
          period:
            type: real_time
          sparkline:
            animate: true
            show:
              chart_type: bar
            state_values:
              aggregate_func: last
            bar:
              orientation: horizontal
              foreground:
                show:
                  item_style: fixed
                color: white
                styles:
                  stroke-width: 1
                  stroke: white
                  fill: white
                  fill-opacity: 0.5
                  rx: 1px
                  ry: 1px
              background:
                show:
                  item_style: fixed
                styles:
                  stroke-width: 0
                  fill: white
                  fill-opacity: 0.5
                  rx: 1px
                  ry: 1px
          y_axis:
            lower_bound: 0
            upper_bound: 100
        - id: grid-2
          group: grid-2
          same_as: grid-1
          same_as_dentity_index: 1
        - id: grid-3
          group: grid-3
          same_as: grid-2
          same_as_dentity_index: 1
        - id: grid-4
          group: grid-4
          same_as: grid-3
          same_as_dentity_index: 1


        - id: 4-cpu-graph
          group: chart
          xpos: 50
          ypos: 50
          width: 90
          height: 70
          margin: 1
          period:
            type: rolling_window
            rolling_window:
              duration:
                hour: 24
              bins:
                per_hour: auto
                density: medium
          sparkline:
            state_values:
              aggregate_func: avg
            show:
              chart_type: line
              line: true
              grid: true
              axis: true
              tickmarks: true
              labels: true
              xlabels_at: ticks_major
              ylabels_at: ticks_major
              legend: true
            line:
              line_width: 0.5
              show_minmax: '[var_show_minmax]'
            legend:
              position: top
              rows: 2
              gap: 5
              styles:
                font-size: 1em
          x_axis:
            labels:
              styles:
                font-size: 1em
          y_axis:
            labels:
              styles:
                font-size: 1em
          series:
            - id: '0'
              entity_index: 0
              color: '#4DD0E1'
            - id: '1'
              entity_index: 1
              color: '#66BB6A'
            - id: '2'
              entity_index: 2
              color: '#FFA726'
            - id: '3'
              entity_index: 3
              color: '#AB47BC'
