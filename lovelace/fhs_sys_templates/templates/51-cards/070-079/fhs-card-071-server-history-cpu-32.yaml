fhs_card_071_server_history_cpu_32:
  template:
    type: card
    defaults:
      - var_colorstop_template: fhs_colorstops_cpu_load
      - var_title: 'CPU Load'
  card:
    layout:
      aspectratio: 1/1.35

      groups:
        - id: title
          xpos: 50
          ypos: 8
        - id: chart
          xpos: 50
          ypos: 56

      texts:
        - id: title
          group: title
          xpos: 50
          ypos: 50
          text: Dual y-axis sparkline
          styles:
            font-size: 1.1em
            font-weight: bold
            text-anchor: middle
            dominant-baseline: central

      sparklines:
        - id: dual-axis-comparison
          group: chart
          # entity_index: 0
          xpos: 50
          ypos: 50
          width: 88
          height: 78
          margin: 1
          period:
            type: rolling_window
            rolling_window:
              duration:
                hour: 24
              bins:
                per_hour: auto
                density: medium
          sparkline:
            state_values:
              aggregate_func: avg
            show:
              chart_type: line
              line: true
              grid: true
              axis: true
              tickmarks: true
              labels: true
              xlabels_at: ticks_major
              ylabels_at: ticks_major
              legend: true
            line:
              line_width: 0.5
            legend:
              position: top
              rows: 2
              gap: 5
          x_axis:
            labels:
              styles:
                font-size: 0.5em
          y_axis:
            labels:
              styles:
                font-size: 0.5em
          series:
            - id: '0'
              entity_index: 0
              # color: "#42a5f5"
              # y_axis_id: primary
            - id: '1'
              entity_index: 1
              # color: "#f9a825"
              # y_axis_id: primary
            - id: '2'
              entity_index: 2
              # color: "#66bb6a"
              # y_axis_id: secondary
              # sparkline:
              #   line:
              #     styles:
              #       stroke-dasharray: "4 2"
            - id: '3'
              entity_index: 3
            - id: '4'
              entity_index: 4
            - id: '5'
              entity_index: 5
            - id: '6'
              entity_index: 6
            - id: '7'
              entity_index: 7
