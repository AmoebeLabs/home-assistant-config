fhs_card_062_sensor_icon_name_state_history:
  template:
    type: card
    defaults:
      - var_chart_type: area
      - var_chart_variant: ''
      - var_colorstop: fhs_colorstops_awair_temperature
  card:
    aspectratio: 1/0.25
    layout:
      icons:
        - entity_index: 0
          xpos: 10
          yposc: 12.5
          size: 2.5

      names:
        - entity_index: 0
          xpos: 20
          ypos: 7.5
          ellipsis: 18
          styles:
            text-anchor: start
            font-size: 1.2em # HA: 14px
            text-transform: none
            alignment-baseline: central

      states:
        - entity_index: 0
          xpos: 20
          ypos: 19.5
          ellipsis: 18
          styles:
            text-anchor: start
            font-size: 1.1em  # HA: 12px
            alignment-baseline: central
            font-weight: bold

      sparklines:
        - id: history
          entity_index: 0
          xpos: 60
          ypos: 12.2
          width: 80
          height: 25
          sparkline:
            show:
              chart_type: '[[var_chart_type]]'
              chart_variant: '[[var_chart_variant]]'
              line: true
              area: true
              fill: fade
            line:
              line_width: 1
            barcode:
              column_spacing: 2
              styles:
                opacity: 0.25
            color_stops:
                template:
                  name: '[[var_colorstop]]'
          styles:
            opacity: 0.3