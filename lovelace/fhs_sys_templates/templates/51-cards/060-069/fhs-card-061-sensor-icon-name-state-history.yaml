fhs_card_061_sensor_icon_name_state_history:
  template:
    type: card
    defaults:
      - var_chart_type: area
      - var_chart_variant: ''
      - var_show_day_night: true
      - var_colorstop: fhs_colorstops_awair_temperature
  card:
    aspectratio: 1/0.5
    layout:
      icons:
        - entity_index: 0
          xpos: 10
          yposc: 12.5
          size: 2.5

      names:
        - entity_index: 0
          xpos: 20
          ypos: 7.5
          ellipsis: 18
          styles:
            text-anchor: start
            font-size: 1.2em # HA: 14px
            text-transform: none
            alignment-baseline: central

      states:
        - entity_index: 0
          xpos: 20
          ypos: 19.5
          ellipsis: 18
          styles:
            text-anchor: start
            font-size: 1.1em  # HA: 12px
            alignment-baseline: central

      sparklines:
        - id: history
          entity_index: 0
          xpos: 50
          ypos: 39
          width: 100
          height: 22
          sparkline:
            show:
              chart_type: '[[var_chart_type]]'
              chart_variant: '[[var_chart_variant]]'
              line: true
              area: true
              fill: fade
              day_night: '[[var_show_day_night]]'
            line:
              line_width: 1
            barcode:
              column_spacing: 2
            color_stops:
                template:
                  name: '[[var_colorstop]]'