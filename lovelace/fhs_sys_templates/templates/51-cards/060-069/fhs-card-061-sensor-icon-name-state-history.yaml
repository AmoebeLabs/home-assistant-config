fhs_card_061_sensor_icon_name_state_history:
  template:
    type: card
    defaults:
      - var_colorstop: fhs_colorstops_awair_temperature
  card:
    aspectratio: 1/0.5
    layout:
      icons:
        - entity_index: 0
          xpos: 10
          yposc: 15
          size: 2.5

      names:
        - entity_index: 0
          xpos: 20
          ypos: 8
          styles:
            text-anchor: start
            font-size: 1.2em # HA: 14px
            text-transform: none
            alignment-baseline: central

      states:
        - entity_index: 0
          xpos: 20
          ypos: 20
          styles:
            text-anchor: start
            font-size: 1.1em  # HA: 12px
            alignment-baseline: central

      sparklines:
        - id: history
          entity_index: 0
          xpos: 50
          ypos: 40
          width: 100
          height: 20
          sparkline:
            show:
              chart_type: area
              line: true
              area: true
              fill: fade
              # axis:
              #   x: true
            line:
              line_width: 1
            color_stops:
                template:
                  name: '[[var_colorstop]]'