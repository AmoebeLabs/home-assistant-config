fhs_card_027_horseshoe_power:
  template:
    type: card
  card:
    layout:
      areas:
        - id: 0
          entity_index: 0
          xpos: 0
          ypos: 100
          styles:
            - font-size: 0.75em
            - text-transform: none     
            - text-anchor: start                       
      icons:
        - id: 0
          entity_index: 0
          xpos: 50
          ypos: 23
          size: 1.5
          rotate: 45
          color_stops:
            gap: 3
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'
      hlines:
        - xpos: 50
          ypos: 45
          length: 50
          styles:
            - stroke: var(--disabled-text-color);
      circles:
        - xpos: 45
          ypos: 52
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - xpos: 45
          ypos: 62
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - xpos: 45
          ypos: 72
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;

      states:
        - entity_index: 0
          xpos: 50
          ypos: 38
          styles:
            - font-size: 2.5em
            - font-weight: bold
        - entity_index: 1
          xpos: 48
          ypos: 55
          styles:
            - text-anchor: start;
            - font-size: 1.2em;                  
        - entity_index: 2
          xpos: 48
          ypos: 65
          styles:
            - text-anchor: start;
            - font-size: 1.2em;                  
        - entity_index: 3
          xpos: 48
          ypos: 75
          styles:
            - text-anchor: start;
            - font-size: 1.2em;
      names:
        - id: 0
          entity_index: 0
          xpos: 50
          ypos: 90
          ellipsis: 20
          styles:
            - font-size: 1.4em
            - text-transform: none
        - entity_index: 1
          xpos: 42
          ypos: 55
          styles:
            - text-anchor: end;
            - font-size: 1.2em;                  
        - entity_index: 2
          xpos: 42
          ypos: 65
          styles:
            - text-anchor: end;
            - font-size: 1.2em;                  
        - entity_index: 3
          xpos: 42
          ypos: 75
          styles:
            - text-anchor: end;
            - font-size: 1.2em;
      horseshoes_v2:
        - entity_index: 0
          xpos: 50
          ypos: 75
          radius: 70 #45
          tickmarks_radius: 43
          arc_degrees: 70
          
          show:
            horseshoe: true
            scale_tickmarks: false
            horseshoe_style: colorstopgradient
            scale_style: fixed #colorstop #fixed
            labels_at: minmax # colorstop, none, ticks_major, both, minmax
            ticks: true
            label_badges: true                  
            label_background: none # none, fixed, colorstop
          # 
          horseshoe_scale:
            min: 0
            max: 5
            width: 6
            color: var(--primary-background-color)
            ticksize: 0.1 # 5-0 = 5 with 0.1 per tick = 50 ticks.
            gap: 3
            styles:
              - opacity: 0.7;
          #
          horseshoe_tickmarks:
            ticks_major:
              ticksize: 1
              color_mode: colorstopinterpolated
              width: 12
              offset: -9
              thickness: 1
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.7;
            ticks_minor:
              ticksize: 0.1
              color_mode: colorstopinterpolated
              thickness: 1
              width: 6
              offset: -12
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.5;
          #
          horseshoe_labels:
            distance_min: 0.3
            ticksize_min: 0.3
            orientation: arc #horizontal #arc
            background:
              width: 10
              gap: 3  
              styles:
                - opacity: 0.05;
                - stroke: var(--primary-text-color);
            badges:
              radius: 6
              color: var(--card-background-color)
              border_color: var(--divider-color)
              padding: 0
              height: 10    # 12 is same as font-size of 1em    
            styles:
              - font-size: 0.7em
          #
          horseshoe_state:
            width: 12
          #
          color_stops:
            gap: 3
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'
