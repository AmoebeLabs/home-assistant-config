fhs_card_024_horseshoe_power:
  template:
    type: card
  card:
    layout:
      areas:
        - id: 0
          entity_index: 0
          xpos: 0
          ypos: 100
          styles:
            - font-size: 0.75em
            - text-transform: none     
            - text-anchor: start                       
      icons:
        - id: 0
          entity_index: 0
          xpos: 50
          ypos: 30
          size: 2
          color_stops:
            gap: 3
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'                
      hlines:
        - xpos: 50
          ypos: 50
          length: 50
          styles:
            - stroke: var(--disabled-text-color);
      circles:
        - xpos: 50
          ypos: 57
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - xpos: 50
          ypos: 64
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;
        - xpos: 50
          ypos: 71
          radius: 2
          styles:
            - fill: var(--primary-text-color);
            - opacity: 0.5;

      states:
        - entity_index: 0
          xpos: 50
          ypos: 45
          styles:
            - font-size: 2em
            - font-weight: bold
        - entity_index: 1
          xpos: 53
          ypos: 59
          styles:
            - text-anchor: start;
            - font-size: 1em;                  
        - entity_index: 2
          xpos: 53
          ypos: 66
          styles:
            - text-anchor: start;
            - font-size: 1em;                  
        - entity_index: 3
          xpos: 53
          ypos: 73
          styles:
            - text-anchor: start;
            - font-size: 1em;
      names:
        - id: 0
          entity_index: 0
          xpos: 50
          ypos: 10
          ellipsis: 20
          styles:
            - font-size: 1.4em
            - text-transform: none
        - entity_index: 1
          xpos: 47
          ypos: 59
          styles:
            - text-anchor: end;
            - font-size: 1em;                  
        - entity_index: 2
          xpos: 47
          ypos: 66
          styles:
            - text-anchor: end;
            - font-size: 1em;                  
        - entity_index: 3
          xpos: 47
          ypos: 73
          styles:
            - text-anchor: end;
            - font-size: 1em;
      horseshoes_v2:
        - entity_index: 0
          xpos: 50
          ypos: 50
          radius: 40
          tickmarks_radius: 38
          arc_degrees: 300
          flip: y
          
          show:
            horseshoe: true
            scale_tickmarks: false
            horseshoe_style: colorstop
            scale_style: fixed #colorstop #fixed
            labels_at: both # colorstop, none, ticks_major, both, minmax
            ticks: false
            label_badges: true                  
            label_background: colorstopsegments # none, fixed, colorstop
          # 
          horseshoe_scale:
            min: 0
            max: 5
            width: 6
            color: var(--secondary-background-color)
            ticksize: 0.1 # 5-0 = 5 with 0.1 per tick = 50 ticks.
            gap: 3
            styles:
              - opacity: 0.4;
          #
          horseshoe_tickmarks:
            ticks_major:
              ticksize: 1
              width: 6
              offset: -12
              thickness: 2
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.7;
            ticks_minor:
              ticksize: 0.1
              thickness: 1
              width: 3
              offset: -12
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--primary-text-color);
                - opacity: 0.5;
          #
          horseshoe_labels:
            distance_min: 0.3
            ticksize_min: 0.3
            orientation: arc #horizontal #arc
            offset: 12
            background:
              width: 3
              gap: 2
              styles:
                - opacity: 0.8;
                - stroke: var(--primary-text-color);
            badges:
              radius: 8
              color: var(--card-background-color)
              border_color: var(--divider-color)
              padding: 0
              height: 10    # 12 is same as font-size of 1em    
              styles:
                - stroke: var(--primary-text-color);
                - fill: var(--card-background-color);
            styles:
              - font-size: 0.7em
          #
          horseshoe_state:
            width: 12
          #
          color_stops:
            gap: 3
            colors:
              0: 'blue'
              0.1: 'green'
              0.4: 'yellow'
              1: 'orange'
              3: '#e73f10'
              5: 'purple'

